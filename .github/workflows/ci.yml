
name: Arovia CI

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

# Read-only access is sufficient for validation.
permissions:
  contents: read

# Cancel obsolete runs when another commit is pushed to the same PR.
concurrency:
  group: arovia-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: arovia_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arovia_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    env:
      AROVIA_TEST_DB_URL: jdbc:postgresql://localhost:5432/arovia_test
      AROVIA_TEST_DB_USERNAME: postgres
      AROVIA_TEST_DB_PASSWORD: postgres

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run backend unit and architecture tests
        run: ./gradlew --no-daemon clean test

      - name: Run PostgreSQL integration tests
        run: ./gradlew --no-daemon integrationTest

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            apps/api/build/reports/tests/
            apps/api/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend verification
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint and architecture checks
        run: pnpm lint:web

      - name: Run TypeScript validation
        run: pnpm typecheck:web

      - name: Build production application
        run: pnpm build:web
