spring:
  application:
    name: arovia-api

  datasource:
    url: ${AROVIA_DB_URL:jdbc:postgresql://localhost:5432/arovia}
    username: ${AROVIA_DB_USERNAME:arovia_app}
    password: ${AROVIA_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false

  sql:
    init:
      mode: never

  # Server-managed sessions stored in PostgreSQL.
  session:
    timeout: ${AROVIA_SESSION_IDLE_TIMEOUT:30m}
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 * * * * *"

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}

  # Arovia resolves forwarded client addresses itself.
  # Do not let the servlet container rewrite getRemoteAddr().
  forward-headers-strategy: none

  servlet:
    session:
      timeout: ${AROVIA_SESSION_IDLE_TIMEOUT:30m}

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health

  endpoint:
    health:
      access: read-only
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

arovia:
  app:
    web-base-url: ${AROVIA_WEB_BASE_URL:http://localhost:3000}

  web:
    allowed-origin: ${AROVIA_WEB_ORIGIN:http://localhost:3000}

  mail:
    from: ${AROVIA_MAIL_FROM:no-reply@arovia.local}

  identity:
    email-verification-ttl: ${AROVIA_EMAIL_VERIFICATION_TTL:PT24H}
    email-verification-resend-cooldown: ${AROVIA_EMAIL_VERIFICATION_RESEND_COOLDOWN:PT1M}
    password-reset-ttl: ${AROVIA_PASSWORD_RESET_TTL:PT30M}

  security:
    client-address:
      trusted-proxies: []

    session:
      secure-cookie: ${AROVIA_SESSION_COOKIE_SECURE:false}
      absolute-timeout: ${AROVIA_SESSION_ABSOLUTE_TIMEOUT:PT12H}

  rate-limit:
    hmac-key: ${AROVIA_RATE_LIMIT_HMAC_KEY:}
    cleanup-interval-ms: ${AROVIA_RATE_LIMIT_CLEANUP_INTERVAL_MS:900000}

    registration:
      window: ${AROVIA_REGISTRATION_RATE_WINDOW:PT1H}
      ip-limit: ${AROVIA_REGISTRATION_IP_LIMIT:10}
      email-limit: ${AROVIA_REGISTRATION_EMAIL_LIMIT:3}

    resend:
      window: ${AROVIA_RESEND_RATE_WINDOW:PT1H}
      ip-limit: ${AROVIA_RESEND_IP_LIMIT:20}
      email-limit: ${AROVIA_RESEND_EMAIL_LIMIT:5}

    login:
      window: ${AROVIA_LOGIN_RATE_WINDOW:PT15M}
      ip-limit: ${AROVIA_LOGIN_IP_LIMIT:60}
      email-limit: ${AROVIA_LOGIN_EMAIL_LIMIT:10}

    password-reset:
      window: ${AROVIA_PASSWORD_RESET_RATE_WINDOW:PT1H}
      ip-limit: ${AROVIA_PASSWORD_RESET_IP_LIMIT:20}
      email-limit: ${AROVIA_PASSWORD_RESET_EMAIL_LIMIT:5}
      confirmation-limit: ${AROVIA_PASSWORD_RESET_CONFIRMATION_LIMIT:10}

  outbox:
    poll-interval-ms: ${AROVIA_OUTBOX_POLL_INTERVAL_MS:5000}
    batch-size: ${AROVIA_OUTBOX_BATCH_SIZE:10}

    observability:
      refresh-interval-ms: ${AROVIA_OUTBOX_OBSERVABILITY_REFRESH_INTERVAL_MS:30000}

    encryption:
      key: ${AROVIA_OUTBOX_ENCRYPTION_KEY:}
      key-version: ${AROVIA_OUTBOX_ENCRYPTION_KEY_VERSION:local-v1}
      additional-keys: {}

    retry:
      max-attempts: ${AROVIA_OUTBOX_MAX_ATTEMPTS:8}
      base-retry-delay-seconds: ${AROVIA_OUTBOX_BASE_RETRY_DELAY_SECONDS:60}
      max-retry-delay-seconds: ${AROVIA_OUTBOX_MAX_RETRY_DELAY_SECONDS:3600}
      max-jitter-seconds: ${AROVIA_OUTBOX_MAX_JITTER_SECONDS:30}

logging:
  level:
    org.springframework.security: TRACE